<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      color: #eeefe9;
      background: #0c1310;
      font-family: Inter, sans-serif;
      font-feature-settings: "cv11", "ss01", "tnum";
    }
    .card { position: relative; width: 100%; height: 100%; padding: 60px 68px; overflow: hidden; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -.4px; }
    .brand svg { width: 44px; height: 44px; display: block; }
    main { width: 640px; margin-top: 108px; }
    h1 { margin: 0; font-size: 70px; line-height: 1.02; letter-spacing: -2px; font-weight: 700; text-wrap: balance; }
    h1 span { color: #e9a066; }
    .sub { margin-top: 30px; color: #a4aea2; font-size: 24px; font-weight: 500; letter-spacing: -.2px; }
    .panel { position: absolute; right: 68px; top: 96px; width: 360px; padding: 30px; border-radius: 28px; background: #131c18; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 30px 80px rgba(0,0,0,.45); }
    .label { color: #a4aea2; font-size: 16px; font-weight: 500; }
    .ladder { margin-top: 26px; height: 168px; display: flex; align-items: flex-end; gap: 12px; }
    .ladder i { flex: 1; border-radius: 10px 10px 4px 4px; background: rgba(233, 160, 102, .18); }
    .ladder i.hi { background: #e9a066; }
    .axis { margin-top: 10px; height: 1px; background: rgba(255,255,255,.08); }
    .spark { margin-top: 24px; height: 76px; }
    .spark svg { width: 100%; height: 100%; overflow: visible; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#14211b"/>
        <circle cx="37" cy="27" r="11" fill="#e9a066"/>
        <path d="M9 45 22 35l10 5 23-17" stroke="#14211b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 45 22 35l10 5 23-17" stroke="#f3f7f1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>WeatherEdge</span>
    </div>
    <main>
      <h1>Twenty-city <span>temperature forecasting</span></h1>
      <div class="sub">Calibrated daily highs · paper market research</div>
    </main>
    <aside class="panel" aria-hidden="true">
      <div class="label">Bracket probabilities</div>
      <div class="ladder"><i style="height:14%"></i><i style="height:38%"></i><i class="hi" style="height:100%"></i><i style="height:62%"></i><i style="height:24%"></i><i style="height:9%"></i></div>
      <div class="axis"></div>
      <div class="spark">
        <svg viewBox="0 0 300 76" fill="none">
          <path d="M0 58 C40 55, 58 44, 92 46 S150 20, 186 27 S246 48, 300 10" stroke="#e9a066" stroke-width="4" stroke-linecap="round"/>
          <path d="M0 66 C46 64, 84 57, 120 59 S196 67, 300 34" stroke="#76bfcb" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        </svg>
      </div>
    </aside>
  </div>
</body>
</html>
