# Weekly dependency update PRs (audit SEC-01). Security alerts and
# Dependabot security updates are repository settings the owner enables in
# GitHub (Settings -> Code security); this file drives the version updates.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Minor and patch updates arrive as one PR; majors stay individual PRs.
    # Tiptap packages share exact peer contracts, so they move together.
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      heroui:
        patterns:
          - "@heroui/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
