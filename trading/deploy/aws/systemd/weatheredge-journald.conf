# journald drop-in for the WeatherEdge box (OPS-7, 2026-09-03 audit).
#
# Installed as /etc/systemd/journald.conf.d/zz-weatheredge.conf. Drop-ins are
# applied in lexicographic filename order across /usr/lib, /run, and /etc, and
# the distribution ships /usr/lib/systemd/journald.conf.d/syslog.conf. The
# "zz-" prefix guarantees this file is read last and therefore wins, whatever
# the distribution names its own drop-ins.
#
# ForwardToSyslog=no: the journal is already persistent on this host, so
# forwarding wrote every line a second time -- 260 MB of /var/log/syslog plus
# 128 MB rotated against 561 MB of journal, measured 2026-09-03, for zero
# additional recoverable information. rsyslog is not the reader here; every
# runbook and every health check reads journalctl.
#
# SystemMaxUse=1500M: at 500M the journal covered 2.6-4.5 days, and a
# "four days ago" root cause was literally unavailable during the 2026-09-03
# audit. The paper scan alone logs ~1,228 lines (184 KB) per run. 1.5 G buys
# at least seven days of retention, which is the window incident review
# actually needs, and it is a small fraction of the volume -- the journal is
# capped, not unbounded, so this cannot become the disk-pressure defect that
# OPS-2 is about.
#
# Changes here need `systemctl restart systemd-journald` to take effect; the
# installer does that only when the file's content actually changed.
[Journal]
ForwardToSyslog=no
SystemMaxUse=1500M
