# Deploys the gh-pages branch content via the Pages workflow pipeline instead
# of the legacy Jekyll builder. The legacy builder intermittently failed with
# an opaque "Page build failed." (~3/day at a 5-minute publish cadence), and a
# failed legacy build cannot be cancelled or superseded — it wedged the site
# until the publisher force-pushed past its delivery gate ~25 minutes later.
#
# This file is emitted into every published tree by
# trading/deploy/aws/publish_forecaster_pages.sh (the branch is regenerated on
# each push, so the workflow must ride along or GitHub loses it). The source of
# truth is trading/deploy/aws/pages-deploy-workflow.yml in the WeatherEdge repo.
#
# concurrency.cancel-in-progress makes rapid successive publishes safe: a
# superseded deploy is cancelled instead of queueing, so the newest snapshot
# always wins and the publisher's delivery gate never waits on a doomed build.
name: Deploy GitHub Pages
on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A deploy that has not finished in 5 minutes is hung (healthy runs take
    # ~40-60s). Time it out so it cannot occupy the concurrency group.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_retry_2.outputs.page_url || steps.deployment_retry_3.outputs.page_url }}
    steps:
      - name: Checkout published tree
        uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The artifact API is eventually consistent, and the Pages deployment
      # API can also fail transiently. A single 20-second retry was not enough
      # during the 2026-08-17 GitHub incident: both create-deployment requests
      # returned HTTP 503. Use bounded exponential backoff so a brief upstream
      # outage does not lose the whole publication cycle. The 20+40+80-second
      # waits remain inside the five-minute job timeout; a newer publication
      # still cancels this run through the workflow concurrency policy.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before Pages deployment retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before Pages deployment retry 2
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 40
      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before Pages deployment retry 3
        if: steps.deployment_retry_2.outcome == 'failure'
        run: sleep 80
      - name: Deploy to GitHub Pages (retry 3)
        id: deployment_retry_3
        if: steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
